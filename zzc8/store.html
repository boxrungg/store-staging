<title>BRS ready</title>
<script>
// COUNT-8 probe (w956, test only, staging origin): does a page event mark a quit, and does a write in it land?
// Each load gets an id; keys zzc8:<id>:start, :hb (heartbeat, every 500 ms), :ev (events, appended "name@ms+since"),
// zzc8:<id>:report (what this load found of the load before it). zzc8:loads lists the last 30 ids.
// A second channel, a beacon to a local logger on 127.0.0.1:8977, tells "fired" apart from "write landed" if it gets out.
(function () {
	var P = "zzc8:", t0 = Date.now(), id = t0.toString(36) + Math.random().toString(36).slice(2, 5);
	var LOG = "http://127.0.0.1:8977/ev";
	function g(k) { try { return localStorage.getItem(P + k); } catch (e) { return null; } }
	function s(k, v) { try { localStorage.setItem(P + k, v); } catch (e) {} }
	function beacon(what) {
		var u = LOG + "?id=" + id + "&ev=" + encodeURIComponent(what) + "&t=" + Date.now();
		try { navigator.sendBeacon(u, "b"); } catch (e) {}
		try { fetch(u + "&via=f", { mode: "no-cors", keepalive: true }); } catch (e) {}
	}
	var loads = (g("loads") || "").split(",").filter(Boolean);
	var prev = loads[loads.length - 1];
	var rep = prev ? ("prev " + prev + " start " + g(prev + ":start") + " hb " + g(prev + ":hb") + " ev [" + (g(prev + ":ev") || "") + "]") : "prev none";
	s(id + ":report", rep);
	loads.push(id);
	while (loads.length > 30) {
		var old = loads.shift();
		["start", "hb", "ev", "report"].forEach(function (x) { try { localStorage.removeItem(P + old + ":" + x); } catch (e) {} });
	}
	s("loads", loads.join(","));
	s(id + ":start", String(t0));
	s(id + ":hb", String(t0));
	beacon("load " + rep);
	setInterval(function () { s(id + ":hb", String(Date.now())); }, 500);
	function ev(name) {
		return function (e) {
			var now = Date.now(), d = name;
			if (name === "pagehide") d += ":" + (e && e.persisted ? "p" : "n");
			if (name === "visibilitychange") d += ":" + document.visibilityState;
			var item = d + "@" + now + "+" + (now - t0);
			s(id + ":ev", (g(id + ":ev") || "") + item + ";");
			s(id + ":hb", String(now));
			beacon(item);
		};
	}
	["pagehide", "visibilitychange", "beforeunload", "unload", "freeze"].forEach(function (n) {
		(n === "visibilitychange" || n === "freeze" ? document : window).addEventListener(n, ev(n));
	});
})();
</script>
<script>
// BoxRun store: BoxRun's in-map menu opens this page in Deadlock's built-in browser (a hidden HTML panel) to keep
// your routes, best times and settings between game sessions. Everything stays in this page's local storage on your
// PC; requests arrive in the URL's #fragment, which browsers never send to a server, and answers go back through the
// page title, which the game reads (mod/boxrun/README.md, map note MN-322).
//
// DRAFT v2 (api/client/store.html; the live page is mod/boxrun/web/store.html): everything above still
// works the same, and the page can also reach BoxRun's online codes at api.boxrun.gg when the game asks it to
// (docs/BOXRUN-SHORT-CODES-PROTOCOL.md). Only then does it contact a server: to publish a route, look up a short
// code, fetch a ghost, send a report or list a route of yours in COMMUNITY. Edit keys for routes you publish stay in this page's storage.
// It also sends BoxRun's anonymous counts (docs/BOXRUN-MEASUREMENT.md 5.4) unless OPTIONS > MORE > COUNTS is off: each
// is rebuilt here from a fixed list of fields (an event name, small whole numbers, BoxRun's version, public short codes),
// so nothing else can leave.
//
// Request: #<seq>:<op> with op one of (values URL-encoded):
//   put:<key>:<value>   app:<key>:<value> (append)   del:<key>   dump:<k>   ping
//   pc:<key>:<k>:<value> (piece k of a value, idempotent; 1.6.6; "bad op" on an older page)
//   pc:<key>:<k>/<n>:<value> (piece k of n, 3.2.1 r1: the value is built aside and takes the old one's place at its last
//     piece; pages from 1.6.6 to 3.2.1 read k alone, as parseInt stops at the "/")
//   ver   get:<key>:<k>   (v2)
//   net:<job>:<what>   stage:<job>:<k>:<piece>   job:<job>:<k>   drop:<job>   (v2, online codes)
// Keys: r:<name> a route code, b:<name> its best time, p:<key> a setting; (v2) g:<name> a ghost,
//   k:<code> the edit key of a route you published.
// A write that doesn't fit (the page's storage is full, about 5 MB a site) answers "full" (3.2.1; an older page answered
//   "err QuotaExceededError..."): a put keeps the value it had, and so does a value sent as k/n pieces, whichever piece
//   doesn't fit (the pieces built aside go, freeing their room). Pieces without /n (games before 3.2.1 r1) go in place:
//   piece 0 keeps the value before it, a later piece takes the value's earlier pieces away (a value cut short is no use).
//   Games before 3.2.1 read any answer but "ok" as not saved, as they read the err.
// Answer: title "BRS <seq> <reply>"; dump replies "d <k>/<n> <text>", the dump being
//   "R <name> <best or -> <route code>" and "P <key> <value>" entries joined by " ~~ ", in pieces of 3800 characters
//   (titles reach the game cut at 4096). get and job answer in the same pieces. A read's pieces all come from the dump
//   built at its dump:0 (3.2.1), whatever is written between them.
var KEY = /^[rbpgk]:[a-z0-9_]{1,40}$/, PIECE = 3800;
var API = "https://api.invalid/v1"; // COUNT-8 probe: never the live API
// The second save page (work/gg-fallback/REPORT.md, 11-26): the same page on a CloudFront address, for players whose
// network blocks .gg sites, calls the API at API Gateway's own address. save.boxrun.gg and the staging store keep the
// line above (the staging loaders swap that exact line for their cfg.txt's api=, so the test is on its value).
if (/^https:\/\/api\.boxrun\.gg\//.test(API) && !/^(save\.boxrun\.gg|boxrungg\.github\.io)$/.test(location.hostname))
	API = "https://jb7sar7xfh.execute-api.us-east-1.amazonaws.com/v1";
var JOB = /^[a-z0-9]{1,16}$/, MAX_JOBS = 8, STAGE_MAX = 460000, TRIES = 3, TIMEOUT = 20000;
var jobs = {}, order = [];
function dump() {
	var out = [];
	for (var i = 0; i < localStorage.length; i++) {
		var k = localStorage.key(i);
		if (/^r:/.test(k)) {
			var name = k.slice(2), best = localStorage.getItem("b:" + name);
			out.push("R " + name + " " + (best || "-") + " " + localStorage.getItem(k));
		} else if (/^p:/.test(k)) {
			out.push("P " + k.slice(2) + " " + localStorage.getItem(k));
		}
	}
	return out.sort().join(" ~~ ");
}
// The dump a read is served from (3.2.1, w881's in-game pass): built at dump:0 and kept until the next request after
// its last piece, so a write between two pieces (games from 1.6.6 to 3.2.1 send a setting queued while saving was off
// there, once the first piece's answer turns saving on) can't shift the later pieces: one stored route was cut across
// two and read as broken. A dump:k with no read kept (a page loaded again mid-read) is built fresh, as before.
var dumpText = null, dumpEnded = false;
function dumpPiece(k) {
	if (k === 0 || dumpText === null) dumpText = dump();
	dumpEnded = k + 1 >= Math.max(1, Math.ceil(dumpText.length / PIECE));
	return pieces(dumpText, k);
}
function pieces(text, k) {
	var n = Math.max(1, Math.ceil(text.length / PIECE));
	return "d " + k + "/" + n + " " + text.substr(k * PIECE, PIECE);
}
function answer(op) {
	var f = op.split(":"), what = f[0];
	if (what === "ping") return "pong";
	if (what === "ver") return "v2";
	if (what === "dump") return dumpPiece(parseInt(f[1], 10) || 0);
	if (dumpEnded) { dumpText = null; dumpEnded = false; }      // the read is over
	if (what === "net" || what === "stage" || what === "job" || what === "drop") return online(f);
	var key = f[1] + ":" + f[2];
	if (!KEY.test(key)) return "bad key";
	if (what === "get") {
		var v = localStorage.getItem(key);
		return v === null ? "none" : pieces(v, parseInt(f[3], 10) || 0);
	}
	if (what === "pc") return piece(key, f[3], f.slice(4).join(":"));
	var value = f.slice(3).join(":");
	if (what === "put") localStorage.setItem(key, value);
	else if (what === "app") cutOnFull(key, function () { localStorage.setItem(key, (localStorage.getItem(key) || "") + value); });
	else if (what === "del") { localStorage.removeItem(key); localStorage.removeItem("c:" + key); localStorage.removeItem("n:" + key); localStorage.removeItem("c:n:" + key); }
	else return "bad op";

}
// pc:<key>:<k>:<value>, piece k of a value sent in pieces (the timing audit's B9): asked again after a lost answer, app:
// appended a piece twice and corrupted the saved route or ghost. Piece 0 starts the value over; piece k is appended only
// when it's the next one (the count is kept under c:<key>), and one already in is answered "ok" again. The value is
// stored as put: and app: store it, so older games read it.
function piece(key, k, value) {
	var kn = /^(\d+)(?:\/(\d+))?$/.exec(k);
	if (!kn) return "bad piece";
	k = parseInt(kn[1], 10);
	var n = kn[2] ? parseInt(kn[2], 10) : 0;
	if (kn[2] && !(k < n)) return "bad piece";
	if (n > 1) return pieceAside(key, k, n, value);
	var have = parseInt(localStorage.getItem("c:" + key), 10) || 0;
	// piece 0: the count goes first, so a value that doesn't fit leaves the one before it whole (and no count that would
	// pass the next pieces as already in). The count's own write failing puts the value before it back (review r1, finding
	// 2: the new piece stayed, a prefix of the value, once removing the count had made just room for it)
	if (k === 0) { keepOnFull(key, function () { localStorage.removeItem("c:" + key); localStorage.setItem(key, value); localStorage.setItem("c:" + key, "1"); }); return "ok"; }
	if (k < have) return "ok";
	if (k > have) return "gap " + have;
	cutOnFull(key, function () {
		localStorage.setItem(key, (localStorage.getItem(key) || "") + value);
		localStorage.setItem("c:" + key, String(k + 1));
	});
	return "ok";
}
// pc:<key>:<k>/<n> with n > 1 (3.2.1 r1, review finding 2): the pieces build up under n:<key> (count c:n:<key>, neither in
// the dump), and the last one puts the whole value in the old one's place at once, so a value being replaced stays whole
// until its new one is all in, and a piece that doesn't fit leaves it as it was (the pieces built aside go). The last
// piece asked again after it went in (its answer lost) finds the value's count at n: "ok".
function pieceAside(key, k, n, value) {
	var ak = "n:" + key, ac = "c:" + ak, have = parseInt(localStorage.getItem(ac), 10) || 0;
	// piece 0 also drops the old value's count: a last piece that comes after a failed build then can't pass as in
	if (k === 0) { localStorage.removeItem(ak); localStorage.removeItem(ac); localStorage.removeItem("c:" + key); have = 0; }
	else if (!have) return k === n - 1 && localStorage.getItem("c:" + key) === String(n) ? "ok" : "gap 0";
	else if (k < have) return "ok";
	else if (k > have) return "gap " + have;
	var v = (k ? localStorage.getItem(ak) || "" : "") + value;
	if (k < n - 1) {
		try { localStorage.setItem(ak, v); localStorage.setItem(ac, String(k + 1)); }
		catch (e) { if (isFull(e)) { localStorage.removeItem(ak); localStorage.removeItem(ac); } throw e; }
		return "ok";
	}
	localStorage.removeItem(ak); localStorage.removeItem(ac);
	keepOnFull(key, function () { localStorage.removeItem("c:" + key); localStorage.setItem(key, v); localStorage.setItem("c:" + key, String(n)); });
	return "ok";
}
// a write that doesn't fit puts back the value key had (its count stays gone: no later piece passes as already in)
function keepOnFull(key, write) {
	var old = localStorage.getItem(key);
	try { write(); } catch (e) {
		if (isFull(e)) try { if (old === null) localStorage.removeItem(key); else localStorage.setItem(key, old); } catch (e2) { }
		throw e;
	}
}
// localStorage's own error when a write doesn't fit (Chrome and Steam's browser: QuotaExceededError, code 22; Firefox:
// NS_ERROR_DOM_QUOTA_REACHED, 1014)
function isFull(e) {
	return !!e && (e.name === "QuotaExceededError" || e.name === "NS_ERROR_DOM_QUOTA_REACHED" || e.code === 22 || e.code === 1014 || /quota/i.test(String(e.message || e)));
}
// a later piece that doesn't fit: the value's earlier pieces go too, then the error goes on to handle()
function cutOnFull(key, write) {
	try { write(); } catch (e) {
		if (isFull(e)) { localStorage.removeItem(key); localStorage.removeItem("c:" + key); }
		throw e;
	}
}

// ------------------------------------------------------------------------------------------- online codes (v2)
// A job is one request to the API, named by the game (<job>), so asking again after a lost answer finds the same job
// instead of sending the request twice. Uploads are staged in pieces first; results are read back in pieces.
//   net:<job>:fetch:<code>   net:<job>:ghost:<code>   net:<job>:pub   net:<job>:upd:<code>
//   net:<job>:report:<code>:<reason>   net:<job>:featured[:0]   net:<job>:list:<code>:<1 or 0>   net:<job>:count:<json>
// Codes are BR-XXXXXX or BR-XXXXXX.<version>. pub and upd send the staged text, a JSON body {"route", "ghost"?}.
// Job answers: "w" (working), "e <error> <message>", or the result in pieces "d <k>/<n> <text>":
//   fetch  "R <code>.<version> <latest> <sum> <BR1 code>", then " ~~ G <hero> <souls> <time> <chars> <runner>"
//          when that version has a ghost, then " ~~ N <players>" (distinct players who loaded the code, when the
//          API sends it; older games read neither), then " ~~ T <1 or 0>" (listed in COMMUNITY or code only, when the
//          API sends it; older games ignore it)
//   ghost  "G <code>.<version> <hero> <souls> <time> <runner> <path step ms or 0> <spot> <BOTREC code>[ <BRGP1 path>]"
//   pub, upd  "P <code> <version> <sum>" (pub keeps the new edit key as k:<code>)
//   report "K"
//   list   "T <code> <1 or 0>": the route listed in COMMUNITY (1) or code only (0), with the stored edit key
//   featured  "F <code>.<version> <name with _ for spaces>" (the week's featured route) or "F -" when none, then
//          " ~~ V <latest BoxRun version>", " ~~ M <notice with _ for spaces>", " ~~ O" (codes switched off) and
//          " ~~ AG 0" (the puppet's animation graph switched off, admin.py ag off), each only when set; then, when the API has the COMMUNITY shelf, " ~~ L" and one " ~~ S <list> <code>.<version>
//          <map> <kind or -> <checkpoints> <boxes> <urn 0/1> <hero or -> <gold/silver/bronze or -> <players> <name>
//          <maker or ->" per route (list: pick, featured, popular, new; names with _ for spaces), each followed by
//          " ~~ SP <code> <line>" when the API sends the route's line (shelf.py line(); older games skip it). featured:0 (counts off)
//          asks /featured?count=0, which the server limits under its own name and the stats never read.
//          Then, when the API has the weekly board (docs/BOXRUN-WEEKLY-BOARD.md 7.4), " ~~ W <week id> <code>.<version> <ends>
//          <entries>" (" ~~ W -" when no week is on), " ~~ WC" right after it on a COLLECT week (every marked box must be gone
//          to, week.COLLECT_R), " ~~ WF <place> <entry> <hero> <time> <name>" per fastest time,
//          " ~~ WM <place> <entry> <runs> <name>" per most runs, and " ~~ WL <code> <route name> <fastest name> <time>
//          <hero> <most name> <runs>" for last week's winners ("-" for one that's missing), and " ~~ WN <n> <prev week id or ->"
//          right after W's line (or WC's) when the API numbers its weeks (FIND-15), and " ~~ WLN <last week's id> <n>"
//          after WL (and WLE). Older games read none of them. 3.2: " ~~ WK <maker>" after the week's WM rows, the maker
//          the week rolled with (week.open_week; not the route's latest credit), when the week has one.
//   The weekly board's own jobs (docs/BOXRUN-WEEKLY-BOARD.md 7.4). Each week's entry key is kept as k:week:<week id> =
//   "BRW-..." (and the latest as k:week = "BRW-...|<week id>", which pages before 11-12 kept: read for its week too) and
//   sent only for its own week; the game never reads them.
//   week:<week id>   (a week id is its first Pacific day, 2026-11-02, or 2026-11-02-2 for a second week opened that day)
//          "Y <entry> <time> <runs> <place> <runs place> <of> <status> <name>" (places "-" while held) and
//          the board's segments as featured has them; "Y -" with no entry. Without a key for that week it answers
//          "Y -" from here, with no request. Then the entries just above and below yours, " ~~ YF <place> <entry> <hero>
//          <time> <name>" and " ~~ YM <place> <entry> <runs> <name>" (the API's you.near); older games skip them.
//   wsend:<idempotency key>:<week id>[:2]   the staged entry (POST /week/entry): "E <entry> <time> <runs> <best 1/0> <place>
//          <runs place> <of> <week id>"; a new entry's key is kept as k:week before the game hears of it. With ":2" (3.2

//   wghost:<entry>[:<week id>]   an entry's ghost (from that week), answered as ghost is (the code "-" for a week whose
//          route isn't known)
//   wweek:<week id>   one week's page (GET /weeks/<id>, docs/BOXRUN-WEEKLY-BOARD.md 18.4), with that week's key when kept:

//          name>", then " ~~ PF <place> <entry or -> <hero> <time> <name>" per fastest row, " ~~ PM <place> <entry or ->
//          <runs> <name>" per most-runs row, and with your entry " ~~ PY <entry> <time> <runs> <place> <runs place> <of>
//          <status> <name>" (Y's fields). An odd row is left out. 3.2: " ~~ PK <maker>" after the PM rows (before PY),
//          the maker that week rolled with, when it has one.
//   wrep:<entry>:<reason>   a report (time, ghost, name or other): "K"

//          <players this week> <players> <runners> <started this week> <finished this week> <finish rate 0-1 or ->",

// Runner names have "_" for spaces and "-" when empty (the route text whitelist has neither "_" nor "~").
function online(f) {

function newJob(id) {

function fail(j, error) { j.state = "error"; j.error = error; }
function done(j, text) { j.state = "done"; j.result = text; j.staged = []; }
function code6(code) { return String(code).toUpperCase().replace(/^BR-?/, "").split(".")[0]; }
function codeOk(code) { return /^(BR-?)?[0-9A-Z]{6}(\.[0-9]{1,4})?$/i.test(code); }
function under(s) { return s ? String(s).replace(/ /g, "_") : "-"; }
// the COMMUNITY shelf's routes as " ~~ S ..." segments; an odd item is left out, never the answer. Up to SHELF_MAX a
// list (shelf.py LIST_MAX, 170 since 11-20 (lens 11-21), 120 from 11-18; 40 from 11-08; was 12).
// Route finding (11-18, work/routefind/design-D BUILD.md piece 2), once a route, in segments older games skip:
// " ~~ ST <code> <TAG,TAG,... or -> <main> <souls>" (tags with _ for spaces), " ~~ SV <code> <creator> <m:ss> <title>"
// (BoxRun's video credit), " ~~ SN <code>" (listed in the last 7 days with a ghost), " ~~ SG <code> <seconds>" (3.0.1:
// the latest version's route ghost time, to 2 places, for FARM's sort; 3.0 games skip it); and the samples' cards as

var SHELF_MAX = 170, TAG_RE = /^[A-Z][A-Z ]{1,15}$/;

	var word = function (v) { return v ? under(String(v).replace(/[~_\s]+/g, " ").trim()) : "-"; };
	var told = {};

		(Array.isArray(sh[k]) ? sh[k] : []).slice(0, SHELF_MAX).forEach(function (c) {
			if (!c || !/^BR-[0-9A-Z]{6}$/.test(c.code) || !(c.version > 0) || !/^[a-z0-9_]{1,40}$/.test(c.map || "") ||
				!n(c.checkpoints, 999) || !n(c.boxes, 9999) || !n(c.players, 9999999) || !c.name) return;
			var ti = c.tiers && [c.tiers.gold, c.tiers.silver, c.tiers.bronze].every(function (x) { return typeof x === "number" && x > 0; }) ?

			(b.step || 0) + " " + (b.spot || 0) + " " + b.botrec + (b.path ? " " + b.path : "");
	});
	if (verb === "report") return call(j, "POST", path + "/report", JSON.stringify({ reason: args[1] || "other" }), null,
		function () { return "K"; });
	if (verb === "list") {
		var lk = localStorage.getItem("k:" + code6(code).toLowerCase());
		if (args[1] !== "1" && args[1] !== "0") return fail(j, "bad_request list takes 1 or 0");
		if (!lk) return fail(j, "no_key this PC has no edit key for " + code);
		return call(j, "POST", path + "/listing", JSON.stringify({ listed: args[1] === "1" }), lk, function (b) {
			if (!/^BR-[0-9A-Z]{6}$/.test(b.code) || typeof b.listed !== "boolean") throw new Error("odd answer");
			return "T " + b.code + " " + (b.listed ? 1 : 0);
		});
	}
	if (verb === "mstats") {
		var mk = localStorage.getItem("k:" + code6(code).toLowerCase());
		if (!mk) return fail(j, "no_key this PC has no edit key for " + code);
		return call(j, "GET", "/routes/" + code6(code) + "/stats", null, mk, function (b) {
			var c = function (v) { return typeof v === "number" && v >= 0 && v <= 99999999 && Math.floor(v) === v; };
			// the week's started and finished counts are null until they cover 7 full days (3.2 hand test 1): "-"
			if (!/^BR-[0-9A-Z]{6}$/.test(b.code) || !["players_week", "players", "runners"].every(function (k) { return c(b[k]); }) ||
				!["started_week", "finished_week"].every(function (k) { return b[k] === null || c(b[k]); }))
				throw new Error("odd answer");
			var rate = typeof b.finish_rate === "number" && b.finish_rate >= 0 && b.finish_rate <= 1 ? String(Math.round(b.finish_rate * 1000) / 1000) : "-";
			return "MS " + b.code + " " + b.players_week + " " + b.players + " " + b.runners + " " + (b.started_week === null ? "-" : b.started_week) + " " + (b.finished_week === null ? "-" : b.finished_week) + " " + rate;
		});
	}
	var body = j.staged.join("");
	if (!body) return fail(j, "bad_request nothing was staged");
	// the maker's tags (route finding, 11-18): {"tags": [...], "main": ...} with this PC's edit key; META only on the API
	if (verb === "tags") {
		var tk = localStorage.getItem("k:" + code6(code).toLowerCase());
		if (!tk) return fail(j, "no_key this PC has no edit key for " + code);
		return call(j, "PUT", path + "/tags", body, tk, function (b) {
			if (!/^BR-[0-9A-Z]{6}$/.test(b.code) || !Array.isArray(b.tags)) throw new Error("odd answer");
			return "TG " + b.code + " " + (b.tags.length ? b.tags.map(under).join(",") : "-") + " " + (b.main || "-");
		});
	}
	if (verb === "pub") return call(j, "POST", "/routes", body, null, function (b) {
		if (!/^BR-[0-9A-Z]{6}$/.test(b.code) || !/^BRK-[0-9A-Z]{26}$/.test(b.edit_key)) throw new Error("odd answer");
		localStorage.setItem("k:" + code6(b.code).toLowerCase(), b.edit_key);   // kept before the game hears of it
		return "P " + b.code + " " + b.version + " " + b.sum;
	});
	if (verb === "upd") {
		var key = localStorage.getItem("k:" + code6(code).toLowerCase());
		if (!key) return fail(j, "no_key this PC has no edit key for " + code);
		return call(j, "POST", path + "/versions", body, key, function (b) { return "P " + b.code + " " + b.version + " " + b.sum; });
	}
	fail(j, "bad_request unknown request " + verb);
}
// One API call with retries: the network failing, a timeout, a 5xx, a 409 (busy) or the whole-API throttle is tried again, up to
// TRIES times; anything else is the answer. pub and upd send an Idempotency-Key, so a retry can't publish twice.
function call(j, method, path, body, key, ok, tries) {
	tries = (tries || 0) + 1;
	var headers = {}, ctl = typeof AbortController === "function" ? new AbortController() : null;
	if (body !== null) headers["content-type"] = "application/json";
	if (key) headers["authorization"] = "Bearer " + key;
	if (method === "POST" && !/report$/.test(path)) headers["idempotency-key"] = j.idem;
	var timer = setTimeout(function () { if (ctl) ctl.abort(); }, TIMEOUT);
	function again(error) {
		if (tries < TRIES) setTimeout(function () { call(j, method, path, body, key, ok, tries); }, 1000 * tries * tries);
		else fail(j, error);
	}
	fetch(API + path, { method: method, headers: headers, body: body === null ? undefined : body,
		signal: ctl ? ctl.signal : undefined, credentials: "omit" })
		.then(function (r) {
			clearTimeout(timer);
			return r.text().then(function (t) {
				var b = null;
				try { b = JSON.parse(t); } catch (e) { b = null; }
				// a 429 without our error code is API Gateway's whole-API throttle (a launch-day rush): wait and retry
				// (the weekly board's 409s are answers: no week on, or another route's week)
				var busy = r.status === 409 && !(b && /^(no_week|not_this_week)$/.test(b.error));
				if (r.status >= 500 || busy || (r.status === 429 && !(b && b.error))) return again((b && b.error || "server") + " " + (b && b.message || "the server had a problem"));
				if (!r.ok || !b) return fail(j, (b && b.error || "server") + " " + (b && b.message || "odd answer from the server") +
					(r.status === 429 ? " (" + (r.headers.get("retry-after") || "60") + " s)" : ""));
				// a write the answer needs that doesn't fit (pub's edit key; 3.2.1 r1, review finding 16): "full", so the game makes
				// room and asks the same publish again, which the API answers with the same code and key (its idempotency key)
				try { done(j, ok(b)); } catch (e) { fail(j, isFull(e) ? "full The save space is full. Delete routes you don't play, then SHARE again." : "server odd answer from the server"); }
			});
		}, function () { clearTimeout(timer); again("offline the online library can't be reached"); });
}

function handle() {
	var h = location.hash.slice(1), at = h.indexOf(":");
	if (at < 0) return;
	var seq = h.slice(0, at), reply;
	try { reply = answer(decodeURIComponent(h.slice(at + 1))); } catch (e) { reply = isFull(e) ? "full" : "err " + e; }
	document.title = "BRS " + seq + " " + reply;
}
// values built aside (n:<key> and its count c:n:<key>, pieceAside) left by a game that quit partway through a write:
// cleared when the page loads, before it answers anything (review r2, finding 4: get, del and the dump don't reach
// them, so room-making couldn't free them). A game whose page loads again mid-value hears "gap" and sends it again.
function clearAside() {
	var ks = [];
	for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (/^(c:)?n:/.test(k)) ks.push(k); }
	ks.forEach(function (k) { localStorage.removeItem(k); });
}
try { clearAside(); } catch (e) { }
window.addEventListener("hashchange", handle);
handle();
</script>
